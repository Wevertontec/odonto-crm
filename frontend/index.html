<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>OdontoCRM - Dashboard & SQL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    :root {
      --primary: #0F6E56; --primary-light: #1D9E75; --primary-dark: #085041;
      --bg-main: #F8FAFC; --bg-card: #FFFFFF; --border-color: #E2E8F0;
      --text-main: #1E293B; --text-secondary: #64748B;
      --radius-lg: 16px; --radius-md: 10px;
    }
    body { background-color: #1e1e1e; padding: 20px; }
    .app { display: flex; height: 850px; border-radius: var(--radius-lg); overflow: hidden; background: var(--bg-main); }
    
    /* Sidebar */
    .sidebar { width: 240px; background: var(--primary-dark); display: flex; flex-direction: column; padding: 24px 16px; }
    .sidebar-logo { display: flex; align-items: center; gap: 12px; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; color: white;}
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 4px 0; border-radius: var(--radius-md); cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.65); font-weight: 500; transition: all 0.2s; }
    .nav-item:hover, .nav-item.active { background: var(--primary); color: #fff; }
    
    /* Main Area */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { display: flex; align-items: center; padding: 0 32px; height: 72px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); justify-content: space-between;}
    .page-title { font-size: 18px; font-weight: 600; color: var(--text-main); }
    .content { flex: 1; overflow-y: auto; padding: 32px; display: none; }
    .content.active { display: block; }
    
    /* Cards & Dashboard */
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
    .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 24px; }
    .stat-card { background: white; padding: 24px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); display: flex; align-items: center; gap: 16px; }
    .stat-icon { width: 48px; height: 48px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .stat-val { font-size: 24px; font-weight: 700; color: var(--text-main); margin-top: 4px; }
    
    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
    .form-field { position: relative; }
    .form-field input, .form-field select { font-size: 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; width: 100%; outline: none; background: white;}
    .form-field label { position: absolute; left: 14px; top: 14px; font-size: 14px; color: var(--text-secondary); transition: all 0.2s; pointer-events: none; background: white; padding: 0 4px;}
    .form-field input:focus ~ label, .form-field input:not(:placeholder-shown) ~ label { top: -8px; left: 10px; font-size: 11px; color: var(--primary-light); font-weight: 600; }
    input::placeholder { color: transparent; }

    /* Tabela */
    .table-responsive { width: 100%; margin-top: 16px; }
    .patient-table { width: 100%; border-collapse: collapse; text-align: left; }
    .patient-table th, .patient-table td { padding: 14px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    .patient-table th { color: var(--text-secondary); font-weight: 600; }
    
    .btn-primary { padding: 12px 24px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-weight: 500; cursor: pointer; }
  </style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <i class="ti ti-tooth" style="font-size: 24px;"></i>
      <div class="logo-text">OdontoCRM SQL</div>
    </div>
    <div class="nav-item active" onclick="navegar('dashboard')"><i class="ti ti-chart-pie"></i> Dashboard</div>
    <div class="nav-item" onclick="navegar('pacientes')"><i class="ti ti-users"></i> Lista de Pacientes</div>
    <div class="nav-item" onclick="navegar('cadastro')"><i class="ti ti-user-plus"></i> Novo Cadastro</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="page-title" id="main-title">Dashboard Operacional</div>
    </div>

    <div class="content active" id="page-dashboard">
      <div class="dash-grid">
        <div class="stat-card">
          <div class="stat-icon" style="background: #E1F5EE; color: #0F6E56;"><i class="ti ti-users"></i></div>
          <div><div style="font-size: 13px; color: var(--text-secondary);">Total de Pacientes</div><div class="stat-val" id="dash-pacientes">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background: #E6F1FB; color: #185FA5;"><i class="ti ti-calendar-time"></i></div>
          <div><div style="font-size: 13px; color: var(--text-secondary);">Consultas Realizadas</div><div class="stat-val" id="dash-consultas">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background: #EAF3DE; color: #639922;"><i class="ti ti-coin"></i></div>
          <div><div style="font-size: 13px; color: var(--text-secondary);">Faturamento Total</div><div class="stat-val" id="dash-faturamento">R$ 0,00</div></div>
        </div>
      </div>
    </div>

    <div class="content" id="page-pacientes">
      <div class="card">
        <h3>Pacientes Cadastrados no PostgreSQL</h3>
        <div class="table-responsive">
          <table class="patient-table">
            <thead>
              <tr><th>Nome</th><th>CPF</th><th>WhatsApp</th><th>Convênio</th></tr>
            </thead>
            <tbody id="lista-pacientes-corpo">
              </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="content" id="page-cadastro">
      <div class="card">
        <h3>Identificação do Paciente</h3>
        <form id="formCadastro" class="form-grid">
          <div class="form-field" style="grid-column: 1/-1;">
            <input type="text" id="form-nome" placeholder=" " required>
            <label>Nome Completo *</label>
          </div>
          <div class="form-field">
            <input type="text" id="form-cpf" placeholder=" " required>
            <label>CPF *</label>
          </div>
          <div class="form-field">
            <input type="text" id="form-whatsapp" placeholder=" ">
            <label>WhatsApp</label>
          </div>
          <div class="form-field" style="grid-column: 1/-1;">
            <input type="text" id="form-convenio" placeholder=" ">
            <label>Plano de Saúde / Convênio</label>
          </div>
          <div style="grid-column: 1/-1; text-align: right;">
            <button type="submit" class="btn-primary">Salvar no PostgreSQL</button>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>

<script>
  // Mude para a URL gerada pelo Coolify para o seu backend
  const API_URL = '/api'; 

  function navegar(pagina) {
    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + pagina).classList.add('active');
    
    // Atualizar títulos e carregar dados dinâmicos
    if(pagina === 'dashboard') {
      document.getElementById('main-title').textContent = 'Dashboard Operacional';
      carregarDashboard();
    } else if(pagina === 'pacientes') {
      document.getElementById('main-title').textContent = 'Base de Clientes';
      carregarPacientes();
    } else {
      document.getElementById('main-title').textContent = 'Novo Registro';
    }
  }

  // Enviar dados para o banco via API
  document.getElementById('formCadastro').addEventListener('submit', async (e) => {
    e.preventDefault();
    const dados = {
      nome: document.getElementById('form-nome').value,
      cpf: document.getElementById('form-cpf').value,
      whatsapp: document.getElementById('form-whatsapp').value,
      convenio: document.getElementById('form-convenio').value
    };

    const response = await fetch(`${API_URL}/pacientes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    });

    if(response.ok) {
      alert('Paciente salvo com sucesso no banco PostgreSQL!');
      document.getElementById('formCadastro').reset();
      navegar('pacientes');
    } else {
      alert('Erro ao salvar paciente.');
    }
  });

  // Buscar Pacientes do Banco
  async function carregarPacientes() {
    const response = await fetch(`${API_URL}/pacientes`);
    const pacientes = await response.json();
    const corpo = document.getElementById('lista-pacientes-corpo');
    corpo.innerHTML = '';
    pacientes.forEach(p => {
      corpo.innerHTML += `<tr><td><b>${p.nome}</b></td><td>${p.cpf}</td><td>${p.whatsapp || '—'}</td><td>${p.convenio || 'Particular'}</td></tr>`;
    });
  }

  // Buscar Métricas do Dashboard do Banco
  async function carregarDashboard() {
    const response = await fetch(`${API_URL}/dashboard`);
    const dados = await response.json();
    document.getElementById('dash-pacientes').textContent = dados.totalPacientes;
    document.getElementById('dash-consultas').textContent = dados.totalConsultas;
    document.getElementById('dash-faturamento').textContent = `R$ ${parseFloat(dados.faturamentoTotal).toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
  }

  // Carregamento Inicial
  carregarDashboard();
</script>
</body>
</html>
